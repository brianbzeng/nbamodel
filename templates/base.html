<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}ESPN Odds Predictor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="{{ url_for('home') }}">
          <span class="brand-mark">EO</span>
          <span class="brand-copy">
            <strong>ESPN Odds Predictor</strong>
            <small>NBA scraper and Elo dashboard</small>
          </span>
        </a>
        <nav class="nav">
          {% for item in nav_items %}
            <a href="{{ url_for(item.endpoint) }}">{{ item.label }}</a>
          {% endfor %}
        </nav>
      </header>

      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
