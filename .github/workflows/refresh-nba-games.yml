name: Refresh NBA games

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: nba-game-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: python -m pip install pandas requests filelock
      - name: Refresh completed NBA games
        run: python game_updates.py
      - name: Publish updated scores
        run: |
          git add -- data/raw/nba_game_updates.csv
          if git diff --cached --quiet; then
            echo 'No score changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update completed NBA games' -- data/raw/nba_game_updates.csv
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
