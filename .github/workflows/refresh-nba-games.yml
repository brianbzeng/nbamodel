name: Refresh NBA games

on:
  schedule:
    - cron: '17 0-3,6,12-23 * * *'
      timezone: America/New_York
  workflow_dispatch:

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: nba-game-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: python -m pip install pandas requests filelock nbainjuries==1.1.1 scikit-learn
      - name: Refresh completed NBA games
        id: games
        run: python game_updates.py
      - name: Refresh official NBA injury reports
        id: injuries
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python injury_updates.py
      - name: Build the daily prediction board
        id: predictions
        if: ${{ !cancelled() && steps.games.outcome == 'success' }}
        run: python daily_predictions.py
      - name: Publish updated NBA data
        if: ${{ !cancelled() && steps.games.outcome == 'success' }}
        env:
          INJURY_REFRESH_OUTCOME: ${{ steps.injuries.outcome }}
          PREDICTION_REFRESH_OUTCOME: ${{ steps.predictions.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/raw/nba_game_updates.csv
          injury_snapshot=data/raw/official_nba_injuries_by_team_live.csv
          if [[ "$INJURY_REFRESH_OUTCOME" == success && -f "$injury_snapshot" ]]; then
            git add -- "$injury_snapshot"
          fi
          prediction_snapshot=data/raw/nba_daily_predictions.csv
          if [[ "$PREDICTION_REFRESH_OUTCOME" == success && -f "$prediction_snapshot" ]]; then
            git add -- "$prediction_snapshot"
          fi

          if git diff --cached --quiet; then
            last_commit=$(git show -s --format=%ct HEAD)
            if [[ "$INJURY_REFRESH_OUTCOME" == success && "$PREDICTION_REFRESH_OUTCOME" == success ]] && (( $(date +%s) - last_commit > 45 * 86400 )); then
              git commit --allow-empty -m 'Verify NBA data snapshots [skip render]'
            else
              echo 'No NBA data changes to publish.'
              exit 0
            fi
          else
            git commit -m 'Update NBA scores, injury reports, and pregame picks'
          fi
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
